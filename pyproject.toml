[project]
name = "avrokit"
version = "0.1.3"
description = "Python utilities for working with Avro data files"
authors = [{ name = "Greg Brandt", email = "brandt.greg@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["avro", "data", "serialization", "gcs", "s3", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "avro>=1.12.1",
  "datetime-truncate>=1.1.1",
  "requests>=2.32.3",
  "filelock>=3.18.0",
  "boto3-stubs[s3]>=1.38.8",
  "types-requests>=2.32.0.20250328",
  "pyarrow>=22.0.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.38.7"]
gcp = ["google-cloud-storage>=3.6.0", "google-crc32c>=1.7.1"]
all = ["boto3>=1.38.7", "google-cloud-storage>=3.6.0", "google-crc32c>=1.7.1"]

[project.urls]
Homepage = "https://github.com/brandtg/avrokit"
Repository = "https://github.com/brandtg/avrokit"

[project.scripts]
avrokit = "avrokit.tools.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-xdist>=3.0.0",
  "ruff>=0.9.0",
  "ty>=0.0.1a6",
  "faker>=37.1.0",
  "freezegun>=1.5.1",
  "moto[s3]>=5.1.4",
  "reuse>=5.0.2",
  "docker>=7.1.0",
  "types-docker>=7.1.0.20250503",
  "pytest-cov>=6.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
exclude = []
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["avrokit", "tests"]
