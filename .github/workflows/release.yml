name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write # This allows the OIDC authentication
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avrokit
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Verify wheel extras match pyproject.toml
        run: |
          uv run --no-project --python 3.12 python - <<'EOF'
          import email
          import sys
          import tomllib
          import zipfile
          from pathlib import Path

          expected = set(
              tomllib.loads(Path("pyproject.toml").read_text())["project"][
                  "optional-dependencies"
              ]
          )

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              print("No wheel found in dist/")
              sys.exit(1)
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(zf.read(name))
          actual = set(metadata.get_all("Provides-Extra") or [])

          if actual != expected:
              print(
                  f"Extras mismatch for {wheel.name}: "
                  f"pyproject.toml={sorted(expected)} wheel={sorted(actual)}"
              )
              sys.exit(1)
          print(f"Wheel extras match pyproject.toml: {sorted(actual)}")
          EOF

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
